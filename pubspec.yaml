name: shiyin_music
description: "the best music application"
publish_to: 'none'
version: 2.5.1+251

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  http: ^1.5.0
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.3
  # Linux 桌面音频后端：just_audio 官方不出 Linux 实现，社区方案为
  # media_kit(libmpv) 适配。仅在 main.dart 的 Platform.isLinux 分支注册，
  # 不影响 Windows 的 just_audio_windows。运行期依赖系统 libmpv2。
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  window_manager: ^0.4.3
  system_tray: ^2.0.3
  desktop_multi_window: ^0.2.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  screen_retriever: ^0.2.2
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  flutter_lyric: ^3.0.7
  flutter_rust_bridge: 2.12.0
  lpinyin: ^2.0.3
  connectivity_plus: ^7.3.1
  local_notifier: ^0.1.6
  launch_at_startup: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  window_manager:
    path: packages/window_manager

flutter:
  uses-material-design: true
  assets:
    - update.md
    - lib/assets/logo.png
    - lib/assets/app_icon.ico
