name: Build Windows Desktop

# 打 tag（v*）或手动触发时构建 Windows 便携包 + 安装包并附加到 Release，
# 与 build-android.yml / build-linux.yml 互不干扰（不同文件名并发上传同一 Release 安全）。
# macOS 暂不打包：缺 Xcode Rust 链接配置，详见 docs/release-process.md。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 附加附件到 GitHub Release 需要写权限。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-windows:
    name: Build portable.zip + setup.exe (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # windows/CMakeLists.txt 的 rust_engine_build 目标会调用 cargo；
      # runner 自带 VS2022，MSVC 目标为默认工具链。
      - name: Setup Rust toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: windows-x64
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release bundle
        run: flutter build windows --release

      # 统一产物名：tag 去非法字符；非 tag 触发（手动/分支）时版本回退 0.0.0。
      - name: Compute artifact names
        id: names
        shell: pwsh
        run: |
          $raw = '${{ github.ref_name }}'
          $tag = $raw -replace '[^A-Za-z0-9._-]', '_'
          $ver = '0.0.0'
          $fileVer = '0.0.0.0'
          if ($tag -match '^v(\d+\.\d+(\.\d+)?)') {
            $ver = $Matches[1]
            $parts = $ver.Split('.').Count
            $fileVer = $ver + ('.0' * (4 - $parts))
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "filever=$fileVer" >> $env:GITHUB_OUTPUT
          # 版本一致性守卫（仅 tag 为 x.y.z 时校验）：tag 与 pubspec.yaml
          # 的 version 必须一致，否则安装包/应用版本漂移会破坏应用内更新比对。
          if ($tag -match '^v(\d+\.\d+\.\d+)') {
            $tagVer = $Matches[1]
            $pubMatch = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)'
            if (-not $pubMatch) { throw 'pubspec.yaml 中未找到 version: x.y.z' }
            $pubVer = $pubMatch.Matches[0].Groups[1].Value
            if ($pubVer -ne $tagVer) {
              throw "版本不一致：tag v$tagVer 与 pubspec.yaml $pubVer 不匹配，请对齐后再打 tag（见 docs/release-process.md）"
            }
          }

      # portable.zip 与 setup.exe 共用同一份暂存负载（CMake BINARY_NAME 即
      # ShiYinMusic，构建产物无需改名）。
      # 产物统一放 build/dist/（Flutter 约定，build/ 已在 .gitignore 且 flutter clean 会清理）。
      - name: Stage portable directory
        shell: pwsh
        run: |
          $src = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$src\ShiYinMusic.exe")) {
            throw "未找到构建产物：$src\ShiYinMusic.exe"
          }
          # Rust 引擎库是应用运行硬依赖（frb 运行时按 kugou_engine.dll 加载），
          # 缺失时 exe 能启动但所有曲库/搜索功能不可用，必须在暂存前拦截
          # （对齐 build-linux.yml 的 Verify bundle 步骤）。
          if (-not (Test-Path "$src\kugou_engine.dll")) {
            throw "缺少 kugou_engine.dll：$src"
          }
          New-Item -ItemType Directory -Force -Path build\dist\portable | Out-Null
          Copy-Item "$src\*" build\dist\portable -Recurse -Force
          Get-ChildItem build\dist\portable | Select-Object Name, Length

      # 附件在 zip 根目录（解压即可覆盖旧目录）。
      - name: Pack portable zip
        shell: pwsh
        run: |
          $tag = '${{ steps.names.outputs.tag }}'
          7z a -tzip "build\dist\shiyin-$tag-windows-x64-portable.zip" ".\build\dist\portable\*"
          if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          Get-Item "build\dist\shiyin-$tag-windows-x64-portable.zip" | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe：$iscc" }
          $tag = '${{ steps.names.outputs.tag }}'
          $src = (Resolve-Path 'build\dist\portable').Path
          & $iscc `
            "/DAppVersion=${{ steps.names.outputs.ver }}" `
            "/DFileVersion=${{ steps.names.outputs.filever }}" `
            "/DSourceDir=$src" `
            /Obuild\dist `
            installer\shiyin.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败" }
          Rename-Item "build\dist\shiyin-windows-x64-setup.exe" "shiyin-$tag-windows-x64-setup.exe"
          Get-Item "build\dist\shiyin-$tag-windows-x64-setup.exe" | Select-Object Name, Length

      # 完整性 sidecar：每个附件旁生成 `<附件名>.sha256`（sha256sum 文本格式）。
      # 应用内更新下载 setup.exe 后拉取同 URL 的 .sha256 比对（见
      # AppUpdateService._verifySha256Sidecar）；每产物独立 sidecar 也避免
      # 与并发上传的 linux/android workflow 争抢同一份汇总清单。
      - name: Generate sha256 sidecars
        shell: pwsh
        run: |
          Get-ChildItem build\dist\shiyin-*.zip, build\dist\shiyin-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
            Get-Item "$($_.FullName).sha256" | Select-Object Name, Length
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-${{ steps.names.outputs.tag }}
          path: |
            build/dist/shiyin-*-windows-x64-portable.zip
            build/dist/shiyin-*-windows-x64-portable.zip.sha256
            build/dist/shiyin-*-windows-x64-setup.exe
            build/dist/shiyin-*-windows-x64-setup.exe.sha256
          if-no-files-found: error

      # 仅把附件传到已存在的（草稿）Release：gh release upload 只传附件、
      # 不改 Release 状态——转正由 publish-release.yml 在三平台构建全绿后
      # 统一执行（softprops 会自动 finalize 草稿，弃用）。
      - name: Upload to draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "build/dist/shiyin-${{ github.ref_name }}-windows-x64-portable.zip"
            "build/dist/shiyin-${{ github.ref_name }}-windows-x64-portable.zip.sha256"
            "build/dist/shiyin-${{ github.ref_name }}-windows-x64-setup.exe"
            "build/dist/shiyin-${{ github.ref_name }}-windows-x64-setup.exe.sha256"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
