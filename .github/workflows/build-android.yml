name: Build Android APK (arm64)

# 仅在打 tag（v*）或手动触发时打包，避免每次 push 都跑耗时的 Rust 全量编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.4'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      # 安装精确版本的 NDK；cargo-ndk 与 Flutter Gradle 都依赖它。
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (arm64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 缓存 Rust 依赖/产物，避免每次 tag 都跑 20+ 分钟的 LTO 全量编译。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-arm64
          save-if: ${{ github.event_name != 'pull_request' }}

      # 用固定的 CI 调试 keystore 签名（base64 存在 Secret 里），保证每次 tag 签名一致、可覆盖安装。
      # 若未配置该 Secret，则回退为 CI 现生成的 debug.keystore（签名每次不同，仅适合临时验证）。
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed CI debug keystore (stable signature)."
          else
            echo "CI_DEBUG_KEYSTORE_BASE64 not set; generating an ephemeral debug keystore."
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 工程已用 abiFilters 限定 arm64-v8a；release 已绑定 debug 签名配置。
      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build -name 'app-release.apk' -print -quit)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiyin-arm64-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}

      # 打 tag 时自动创建 GitHub Release 并附带 APK。
      # Release 笔记由 gh CLI 手动创建，此处仅附加 APK；
      # 若 Release 已存在则只更新附件，不覆盖 body。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: 时音 ${{ github.ref_name }}
