name: Build Android APK

# 仅在打 tag（v*）或手动触发时打包，避免每次 push 都跑耗时的 Rust 全量编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build ${{ matrix.abi }} release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # 渲染引擎 × ABI 组合：64 位双变体（impeller 默认 / skia 老 GPU
        # 稳定）+ 32 位仅 skia（老车机；老 GPU 上 Impeller 兼容性差，
        # 不值得多打一个变体）。产物名必须含 -$flavor- 与 -$abi-，
        # 应用内更新靠它们选包（见 AppVersionInfo）。
        include:
          - flavor: impeller
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm32
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      # 安装精确版本的 NDK；cargo-ndk 与 Flutter Gradle 都依赖它。
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (${{ matrix.rust-target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 缓存 Rust 依赖/产物，避免每次 tag 都跑 20+ 分钟的 LTO 全量编译。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.event_name != 'pull_request' }}

      # 从 Secret 还原 release 签名密钥并生成 key.properties。
      # 若未配置 Secret，回退为 debug 签名（仅适合临时验证，不可覆盖安装正式版）。
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=shiyin
          keyPassword=$KEYSTORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/PASSWORD not set; falling back to debug signing."
          fi

      - name: Build release APK (${{ matrix.abi }}, ${{ matrix.flavor }})
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.flutter-target }}
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_RENDERER=${{ matrix.flavor }}
          --dart-define=APP_ABI=${{ matrix.abi }}

      - name: Rename APK with flavor and abi
        id: apk
        run: |
          SRC=$(find build -name "app-${{ matrix.flavor }}-release.apk" -print -quit)
          DST="shiyin-${{ github.ref_name }}-${{ matrix.flavor }}-${{ matrix.abi }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"
          # 版本一致性守卫（仅 tag 为 x.y.z 时校验）：tag 与 pubspec.yaml
          # 的 version 必须一致，否则 APK 版本漂移会破坏应用内更新比对。
          if [[ "${{ github.ref_name }}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            tag_ver="${BASH_REMATCH[1]}"
            pub_ver=$(grep -m1 -E '^version:' pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$pub_ver" ]; then
              echo "::error::pubspec.yaml 中未找到 version: x.y.z"
              exit 1
            fi
            if [ "$pub_ver" != "$tag_ver" ]; then
              echo "::error::版本不一致：tag v$tag_ver 与 pubspec.yaml $pub_ver 不匹配，请对齐后再打 tag（见 docs/release-process.md）"
              exit 1
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}

  # 三附件按固定顺序挂到 Release：impeller-arm64 在前、skia-arm64 中、
  # skia-arm32 最后。老版本客户端不懂选包、只拿第一个 .apk 附件，
  # impeller-arm64 在前可保持它们行为不变（老版本只发过 64 位，
  # 不存在 32 位老客户端，arm32 放最后不影响）。
  publish-release:
    name: Attach APKs to Release (impeller-arm64 first)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download impeller arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-impeller-arm64-${{ github.ref_name }}
          path: dist

      - name: Download skia arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm64-${{ github.ref_name }}
          path: dist

      - name: Download skia arm32 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm32-${{ github.ref_name }}
          path: dist

      # 完整性 sidecar：每个 APK 旁生成 `<文件名>.sha256`（与应用内更新
      # 校验约定一致，Android 走浏览器下载由用户自行核对，一并提供）。
      - name: Generate sha256 sidecars
        run: |
          cd dist
          for f in shiyin-*.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la *.sha256

      # Release 笔记由 gh CLI 手动创建，此处仅按顺序附加 APK，不覆盖 body。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shiyin-${{ github.ref_name }}-impeller-arm64.apk
            dist/shiyin-${{ github.ref_name }}-impeller-arm64.apk.sha256
            dist/shiyin-${{ github.ref_name }}-skia-arm64.apk
            dist/shiyin-${{ github.ref_name }}-skia-arm64.apk.sha256
            dist/shiyin-${{ github.ref_name }}-skia-arm32.apk
            dist/shiyin-${{ github.ref_name }}-skia-arm32.apk.sha256
          name: 时音 ${{ github.ref_name }}
