name: Build Android APK (arm64)

# 仅在打 tag（v*）或手动触发时打包，避免每次 push 都跑耗时的 Rust 全量编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build arm64-v8a release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # 渲染引擎双变体：skia（老 GPU 稳定）/ impeller（默认）。
        # 产物名必须含 -$flavor-，应用内更新靠它选包（见 AppVersionInfo）。
        flavor: [impeller, skia]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      # 安装精确版本的 NDK；cargo-ndk 与 Flutter Gradle 都依赖它。
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (arm64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 缓存 Rust 依赖/产物，避免每次 tag 都跑 20+ 分钟的 LTO 全量编译。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-arm64
          save-if: ${{ github.event_name != 'pull_request' }}

      # 从 Secret 还原 release 签名密钥并生成 key.properties。
      # 若未配置 Secret，回退为 debug 签名（仅适合临时验证，不可覆盖安装正式版）。
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=shiyin
          keyPassword=$KEYSTORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/PASSWORD not set; falling back to debug signing."
          fi

      - name: Build release APK (arm64-v8a, ${{ matrix.flavor }})
        run: flutter build apk --release --target-platform android-arm64 --flavor ${{ matrix.flavor }} --dart-define=APP_RENDERER=${{ matrix.flavor }}

      - name: Rename APK with flavor
        id: apk
        run: |
          SRC=$(find build -name "app-${{ matrix.flavor }}-release.apk" -print -quit)
          DST="shiyin-${{ github.ref_name }}-${{ matrix.flavor }}-arm64.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}

  # 双附件按固定顺序挂到 Release：impeller 在前、skia 在后。
  # 老版本客户端不懂选包、只拿第一个附件，impeller 在前可保持它们行为不变。
  publish-release:
    name: Attach APKs to Release (impeller first)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download impeller APK
        uses: actions/download-artifact@v4
        with:
          name: apk-impeller-${{ github.ref_name }}
          path: dist

      - name: Download skia APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-${{ github.ref_name }}
          path: dist

      # Release 笔记由 gh CLI 手动创建，此处仅按顺序附加 APK，不覆盖 body。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shiyin-${{ github.ref_name }}-impeller-arm64.apk
            dist/shiyin-${{ github.ref_name }}-skia-arm64.apk
          name: 时音 ${{ github.ref_name }}
