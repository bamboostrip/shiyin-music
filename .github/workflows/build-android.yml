name: Build Android APK (arm64)

# 仅在打 tag（v*）或手动触发时打包，避免每次 push 都跑耗时的 Rust 全量编译。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 创建 GitHub Release 需要写权限。
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build arm64-v8a release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      # 安装精确版本的 NDK；cargo-ndk 与 Flutter Gradle 都依赖它。
      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (arm64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 缓存 Rust 依赖/产物，避免每次 tag 都跑 20+ 分钟的 LTO 全量编译。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-arm64
          save-if: ${{ github.event_name != 'pull_request' }}

      # 从 Secret 还原 release 签名密钥并生成 key.properties。
      # 若未配置 Secret，回退为 debug 签名（仅适合临时验证，不可覆盖安装正式版）。
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=shiyin
          keyPassword=$KEYSTORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/PASSWORD not set; falling back to debug signing."
          fi

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Locate APK
        id: apk
        run: |
          APK=$(find build -name 'app-release.apk' -print -quit)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiyin-arm64-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}

      # 打 tag 时自动创建 GitHub Release 并附带 APK。
      # Release 笔记由 gh CLI 手动创建，此处仅附加 APK；
      # 若 Release 已存在则只更新附件，不覆盖 body。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: 时音 ${{ github.ref_name }}
