[package]
name = "kugou_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "charset", "http2", "json", "gzip", "blocking",
] }
# 桌面响度均衡（EBU R128）解码 + 本地音乐标签/时长 probe。
# features 覆盖常见音乐容器；opus 无解码器（probe 失败回退仅路径条目）。
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "wav", "pcm", "ogg", "vorbis", "flac", "isomp4", "aac", "aiff",
] }
# 本地音乐扫描并行 probe。
rayon = "1"
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = { version = "0.11", default-features = false, features = ["alloc"] }
digest = { version = "0.11", default-features = false, features = ["alloc"] }
hex = "0.4"
flate2 = "1"
base64 = "0.22"
rand = "0.10"
aes = "0.9"
cipher = { version = "0.5", features = ["block-padding"] }
rsa = { version = "0.9", features = ["sha2"] }
num-bigint = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
regex = "1"
url = "2"

# 桌面端听歌识曲音频采集:cpal 抓麦克风 / WASAPI loopback(系统内录,
# cpal 0.17+ 对默认输出设备开 input stream 即回环),rubato 重采样到
# 识曲要求的 8000Hz。仅桌面 target,Android 构建不编译这些依赖。
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
cpal = "0.18"
rubato = "0.16"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
